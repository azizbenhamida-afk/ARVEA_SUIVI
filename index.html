tr[data-a]{cursor:pointer}
.bd{border-radius:99px;padding:2px 9px;font-size:12px;color:#fff;white-space:nowrap}
.s_g{background:#2e9e6b}.s_y{background:#b8901a}.s_o{background:#d9772a}.s_r{background:#d64545}.s_n{background:#8a948d}
h2,h3{margin:6px 0}h3{font-size:15px}dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;width:min(520px,92vw)}

function t3(){let w='';for(let i=0;i<4;i++)w+=`<div class="c"><b>${t('week')} ${i+1}</b><div class="g">${lab('date',F(`w.${i}.d`,'date'))}${lab('acts',F(`w.${i}.a`,'area'))}${lab('block',F(`w.${i}.b`,'area'))}${lab('pos',F(`w.${i}.p`,'area'))}${lab('next',F(`w.${i}.n`,'area'))}</div></div>`;
